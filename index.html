<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halime & Ahmet Kemal — Fotoğraflarınızı Paylaşın</title>
<meta name="description" content="Halime ve Ahmet Kemal'in nişanından çektiğiniz fotoğraf ve videoları paylaşın.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f4;
  --ink:#23282b;
  --muted:#717a78;
  --accent:#5b8a83;
  --accent-soft:#e4ecea;
  --line:#e2e6e3;
  --card:#ffffff;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Jost',system-ui,sans-serif;background:var(--bg);color:var(--ink);
  font-weight:300;line-height:1.6;min-height:100svh;
  display:flex;align-items:center;justify-content:center;padding:32px 20px;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:'Cormorant',Georgia,serif}
.card{
  width:100%;max-width:480px;text-align:center;
}
.eyebrow{
  font-size:12px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--accent);font-weight:400;margin-bottom:20px;
}
.names{
  font-size:clamp(40px,11vw,68px);font-weight:400;line-height:1.08;
}
.amp{display:block;font-style:italic;color:var(--accent);font-size:.5em;margin:2px 0}
.date{
  margin-top:18px;font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);
}
.divider{width:40px;height:1px;background:var(--accent-soft);margin:36px auto}
.lead{
  font-family:'Cormorant',serif;font-size:clamp(20px,4.5vw,26px);
  color:var(--ink);margin-bottom:8px;line-height:1.45;
}
.sub{color:var(--muted);font-size:15px;margin-bottom:32px;max-width:380px;margin-left:auto;margin-right:auto}

.field{margin-bottom:18px;text-align:left}
.field label{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.field input{
  width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:12px;
  font-family:inherit;font-size:16px;background:var(--card);color:var(--ink);font-weight:300;
}
.field input:focus{outline:none;border-color:var(--accent)}

.btn{
  width:100%;border:none;cursor:pointer;
  background:var(--accent);color:#fff;font-family:inherit;font-weight:400;
  font-size:16px;letter-spacing:.04em;padding:16px;border-radius:14px;
  transition:transform .15s ease,background .2s ease;
}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:default}
.btn-soft{background:var(--card);color:var(--ink);border:1px solid var(--line)}

.row{display:flex;gap:10px;margin-top:14px}
.row .btn{margin:0}

.hint{margin-top:18px;font-size:13px;color:var(--muted)}

/* yükleme durumu */
.status{margin-top:22px;min-height:24px;font-size:15px;color:var(--ink)}
.bar{height:4px;background:var(--accent-soft);border-radius:999px;overflow:hidden;margin-top:14px;display:none}
.bar > div{height:100%;width:0;background:var(--accent);transition:width .3s ease}

/* önizleme küçük resimler */
.thumbs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.thumbs .t{width:60px;height:60px;border-radius:10px;object-fit:cover;border:1px solid var(--line);position:relative}
.thumbs .t.ok{outline:2px solid var(--accent)}

.foot{margin-top:36px;font-size:12px;letter-spacing:.1em;color:var(--muted)}
.foot .h{color:var(--accent)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <p class="eyebrow">Nişan · 18 Temmuz 2026</p>
  <h1 class="names serif">Halime<span class="amp serif">&amp;</span>Ahmet Kemal</h1>
  <div class="divider"></div>

  <p class="lead serif">Bu güzel günü birlikte yaşıyoruz.</p>
  <p class="sub">Çektiğiniz fotoğraf ve videoları bizimle paylaşın — hepsi tek bir yerde toplansın.</p>

  <div class="field">
    <label for="uploader">Adınız (isteğe bağlı)</label>
    <input id="uploader" type="text" placeholder="Adınız" autocomplete="name">
  </div>

  <input type="file" id="files" accept="image/*,video/*" multiple hidden>
  <button class="btn" id="pick">Fotoğraf veya video seç</button>

  <div class="bar" id="bar"><div></div></div>
  <div class="status" id="status"></div>
  <div class="thumbs" id="thumbs"></div>

  <div class="row" id="after" style="display:none">
    <button class="btn" id="more">Daha fazla ekle</button>
    <a class="btn btn-soft" id="galleryLink" href="#" target="_blank" rel="noopener" style="text-decoration:none;display:flex;align-items:center;justify-content:center">Galeriyi gör</a>
  </div>

  <p class="hint">Fotoğraflar doğrudan çiftin albümüne yüklenir.</p>

  <p class="foot">Halime <span class="h">&amp;</span> Ahmet Kemal · 2026</p>
</main>

<script>
// ── Anipano bağlantısı ──
const API_BASE = 'https://anipano.ahmetkcavusoglu.workers.dev';
const SLUG = 'halime-ahmet-kemal-eftr';

document.getElementById('galleryLink').href = API_BASE + '/g/' + SLUG;

const fileInput = document.getElementById('files');
const pick = document.getElementById('pick');
const more = document.getElementById('more');
const statusEl = document.getElementById('status');
const bar = document.getElementById('bar');
const barFill = bar.firstElementChild;
const thumbs = document.getElementById('thumbs');
const after = document.getElementById('after');

pick.onclick = () => fileInput.click();
more.onclick = () => fileInput.click();

function vidDur(f){
  return new Promise((res,rej)=>{
    const v=document.createElement('video');v.preload='metadata';
    v.onloadedmetadata=()=>res(Math.round(v.duration));v.onerror=rej;
    v.src=URL.createObjectURL(f);
  });
}

fileInput.onchange = async (e) => {
  const files = [...e.target.files];
  if(!files.length) return;
  after.style.display = 'none';
  thumbs.innerHTML = '';
  pick.disabled = true; more.disabled = true;
  bar.style.display = 'block';

  const uploader = document.getElementById('uploader').value.trim();
  let done = 0, failed = 0;

  // küçük önizlemeler
  const thumbEls = files.map(f=>{
    if(!f.type.startsWith('image')) return null;
    const img=document.createElement('img');
    img.className='t';img.src=URL.createObjectURL(f);
    thumbs.appendChild(img);return img;
  });

  for(let i=0;i<files.length;i++){
    const f = files[i];
    statusEl.textContent = 'Yükleniyor… ' + (i+1) + ' / ' + files.length;
    barFill.style.width = ((i)/files.length*100) + '%';

    const kind = f.type.startsWith('video') ? 'video' : 'photo';
    let duration = 0;
    if(kind==='video'){ try{ duration = await vidDur(f); }catch{} }

    const fd = new FormData();
    fd.append('file', f);
    fd.append('kind', kind);
    fd.append('uploader', uploader);
    fd.append('duration', duration);

    try{
      const r = await fetch(API_BASE + '/api/events/' + SLUG + '/confirm', { method:'POST', body:fd });
      const d = await r.json();
      if(d.error){ failed++; }
      else { done++; if(thumbEls[i]) thumbEls[i].classList.add('ok'); }
    }catch(err){ failed++; }
  }

  barFill.style.width = '100%';
  setTimeout(()=>{ bar.style.display='none'; barFill.style.width='0'; }, 600);

  if(done && !failed) statusEl.textContent = '✓ ' + done + ' dosya yüklendi. Teşekkür ederiz!';
  else if(done && failed) statusEl.textContent = '✓ ' + done + ' yüklendi · ' + failed + ' başarısız oldu.';
  else statusEl.textContent = 'Yükleme başarısız oldu. Lütfen tekrar deneyin.';

  pick.disabled = false; more.disabled = false;
  pick.style.display = 'none';
  after.style.display = 'flex';
  fileInput.value = '';
};
</script>
</body>
</html>
